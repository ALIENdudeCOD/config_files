background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 2
}

general {
    hide_cursor = true
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2

    outer_color = rgb(7a8ea3)
    inner_color = rgb(1f2329)
    font_color = rgb(d7dadc)

    fade_on_empty = false
    placeholder_text = Password...

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = rgba(d7dadcff)

    font_size = 60
    font_family = JetBrainsMono Nerd Font

    position = 0, 80

    halign = center
    valign = center
}
